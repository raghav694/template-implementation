name: app_template
description: Reusable Flutter application template with flavors, Firebase, and centralized configuration.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  firebase_core: ^4.14.0
  firebase_analytics: ^12.5.0
  cloud_firestore: ^6.9.0
  firebase_messaging: ^16.6.0
  firebase_remote_config: ^6.6.0
  firebase_crashlytics: ^5.3.0
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.4
  fpdart: ^1.1.1
  freezed_annotation: ^3.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  pinput: ^6.0.2
  smart_auth: ^3.2.0
  mixpanel_flutter: ^2.10.0
  facebook_app_events: ^0.28.0
  package_info_plus: ^9.0.1
  permission_handler: ^12.0.3
  flutter_inappwebview: ^6.1.5
  dio: ^5.9.0
  retrofit: ^4.9.2
  app_links: ^6.4.1
  play_install_referrer: ^0.5.0
  in_app_update: ^4.2.3
  upgrader: ^13.1.0
  growthbook_sdk_flutter: ^4.2.2
  truecaller_sdk: ^1.2.0
  qr_flutter: ^4.1.0
  capslock_payments_sdk:
    git:
      url: git@github.com:VoiceClub-app/capslock-payments.git
      path: sdks/flutter
      ref: 0.1.0-b1
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  retrofit_generator: ^10.2.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - assets/logo/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
