# Central project identity for this Flutter app template.
# After cloning, run: ./scripts/setup_project.sh
# Firebase projects: ./scripts/setup_firebase.sh
# Do not put secrets here. Tokens and API keys belong in gitignored .env files.

app:
  name: "__APP_NAME__"
  dart_package: "app_template"
  android_package: "__ANDROID_PACKAGE__"
  # Optional. Leave as __IOS_BUNDLE_ID__ to skip iOS setup (Android-only).
  ios_bundle_id: "__IOS_BUNDLE_ID__"
  support_email: "__SUPPORT_EMAIL__"
  terms_url: "__TERMS_URL__"
  privacy_url: "__PRIVACY_URL__"
  refund_url: "__REFUND_URL__"

environment:
  dev:
    api_base_url: "__DEV_API_URL__"
    display_name: "__APP_NAME__ Dev"
    android_application_id_suffix: ".dev"
    ios_bundle_id_suffix: ".dev"
  prod:
    api_base_url: "__PROD_API_URL__"
    display_name: "__APP_NAME__"

firebase:
  functions_region: "asia-south1"
  # true: setup_firebase.sh creates the YAML project IDs if they are missing
  create_if_missing: true
  dev:
    project_id: "__DEV_FIREBASE_PROJECT_ID__"
  prod:
    project_id: "__PROD_FIREBASE_PROJECT_ID__"

analytics:
  mixpanel:
    # Tokens live in .env.dev / .env.prod — never commit real values.
    dev_token: ""
    prod_token: ""

deeplink:
  scheme: "__APP_SCHEME__"
  host: "__DEEPLINK_HOST__"

# Optional branding. All fields are optional — run ./scripts/setup_theme.sh
