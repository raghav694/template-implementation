name: Auto Release on dev → main merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Get version tag from pubspec
        id: get_tag
        run: |
          RAW_VERSION=$(awk -F':' '/^version[[:space:]]*:/{print $2; exit}' pubspec.yaml | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' | tr -d '"' | tr -d "'")
          if [ -z "$RAW_VERSION" ]; then
            echo "Unable to read version from pubspec.yaml"
            exit 1
          fi

          APP_VERSION="${RAW_VERSION%%+*}"
          if [ -z "$APP_VERSION" ]; then
            echo "Unable to parse app version from pubspec.yaml (value: $RAW_VERSION)"
            exit 1
          fi

          NEW_TAG="v${APP_VERSION}"

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Version from pubspec.yaml: $RAW_VERSION → Tag: $NEW_TAG"

      - name: Check existing tag and release
        id: check_existing
        uses: actions/github-script@v7
        with:
          script: |
            const tag = "${{ steps.get_tag.outputs.new_tag }}";
            const { owner, repo } = context.repo;

            let tagExists = false;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagExists = true;
              core.info(`Tag ${tag} already exists. Skipping tag creation.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              releaseExists = true;
              core.info(`Release for ${tag} already exists. Skipping release creation.`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            core.setOutput('tag_exists', String(tagExists));
            core.setOutput('release_exists', String(releaseExists));

      - name: Create tag
        if: steps.check_existing.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.get_tag.outputs.new_tag }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release with auto-generated notes
        if: steps.check_existing.outputs.release_exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ steps.get_tag.outputs.new_tag }}",
              name: "${{ steps.get_tag.outputs.new_tag }}",
              generate_release_notes: true,
              draft: false,
              prerelease: false
            });
