# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/logo/logo.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/logo/foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
